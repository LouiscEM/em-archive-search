<style>body{margin:0;background:#fff}
.emq *{box-sizing:border-box}
.emq{font-family:'Open Sans',Arial,Helvetica,sans-serif;color:#3A4A5C;line-height:1.65}
.emq .wrap{max-width:1140px;margin:0 auto;padding:0 20px}
.emq .kicker{font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;font-size:12px;letter-spacing:.24px;
 text-transform:uppercase;margin:0 0 14px;color:#F15959}

/* hero ------------------------------------------------------------------ */
.emq .hero{background:#18263B;padding:56px 0 72px;margin-bottom:0}
.emq .hero .kicker{color:rgba(255,255,255,.86)}
.emq .hgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.emq h1{font-family:'Franklin Gothic Heavy','Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;font-size:60px;line-height:1.02;color:#fff;margin:0;

.emq .actions{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.emq .btn{display:inline-block;font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;font-size:16px;padding:13px 20px;
 border-radius:6px;text-decoration:none;border:1px solid #F15959;transition:.15s}
.emq .btn.primary{background:#F15959;color:#fff}
.emq .btn.primary:hover{background:#d94a4a;border-color:#d94a4a;color:#fff}
.emq .btn.secondary{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.emq .btn.secondary:hover{border-color:#fff;color:#fff}
.emq .panel{position:relative}

.emq .panel .note{position:absolute;left:-18px;bottom:-18px;background:#fff;
 border-radius:10px;padding:14px 18px;display:flex;gap:12px;align-items:center;

 display:flex;align-items:center;justify-content:center;flex:0 0 38px;font-size:14px}
.emq .note .nt{font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;color:#18263B;font-size:14px;line-height:1.3}

/* sections -------------------------------------------------------------- */
.emq section{padding:72px 0}
.emq .sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:40px;
 margin-bottom:38px;border-bottom:1px solid #D0D5DD;padding-bottom:22px}

 font-weight:400;letter-spacing:-.4px}
.emq .sec-head > p{color:#8A97A8;font-size:15px;margin:0;max-width:34ch;text-align:right}
.emq .answer{max-width:760px}
.emq .answer p{font-size:19px;line-height:1.75;margin:0 0 24px}
.emq .answer p:first-child{font-size:24px;line-height:1.5;color:#18263B;
 font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif}

/* episode cards --------------------------------------------------------- */
.emq .cards{display:grid;gap:14px}
.emq a.card{display:flex;gap:22px;text-decoration:none;background:#fff;
 border:1px solid #D0D5DD;border-radius:10px;padding:16px;align-items:center;
 transition:.18s}
.emq a.card:hover{border-color:#18263B;box-shadow:0 10px 26px rgba(24,38,59,.1);
 transform:translateY(-2px)}
.emq a.card.first{background:#F5F6F8;border-color:#18263B;border-width:2px}
.emq .art,.emq .body,.emq .tile,.emq .ttl,.emq .meta,.emq .flag{display:block}
.emq .art{position:relative;flex:0 0 232px;aspect-ratio:16/9;border-radius:8px;
 overflow:hidden;background:#18263B}
.emq a.card.first .art{flex-basis:300px}
.emq .art img{width:100%;height:100%;object-fit:cover;display:block;margin:0}
.emq .play{position:absolute;inset:0;display:flex;align-items:center;
 justify-content:center}
.emq .play span{width:46px;height:46px;border-radius:50%;background:rgba(241,89,89,.95);
 color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;
 padding-left:3px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.emq .tile{width:100%;height:100%;display:flex!important;align-items:center;
 justify-content:center;background:#18263B;color:#fff;font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;font-size:12px;
 letter-spacing:1.4px;text-transform:uppercase;text-align:center;padding:12px;
 line-height:1.4;border-bottom:3px solid #F15959}
.emq .body{flex:1;min-width:0}
.emq .flag{font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
 color:#F15959;margin:0 0 8px}
.emq .ttl{font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;font-size:19px;line-height:1.3;color:#18263B;margin:0}
.emq a.card.first .ttl{font-size:23px}
.emq .meta{color:#8A97A8;font-size:13px;margin:9px 0 0}
.emq .jump{display:inline-block;margin-top:14px;background:#18263B;color:#fff;
 font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;font-size:13px;padding:8px 14px;border-radius:6px}
.emq .jump b{color:#F15959;font-weight:400}
.emq a.card:hover .jump{background:#F15959}
.emq a.card:hover .jump b{color:#fff}

/* where things stand -------------------------------------------------- */
.emq .note2{background:#F5F6F8;border:1px solid #D0D5DD;border-left:5px solid #18263B;
 border-radius:10px;padding:20px 24px;margin:0 0 34px;max-width:760px}
.emq .note2 .nh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
 align-items:baseline;margin-bottom:8px}
.emq .note2 .nt{font-family:'Franklin Gothic Demi','Franklin Gothic Medium',Arial,sans-serif;color:#18263B;font-size:17px}
.emq .note2 .nd{color:#8A97A8;font-size:12.5px}
.emq .note2 p{margin:0;font-size:16px;line-height:1.65;color:#3A4A5C}
.emq .note2 .ns{margin:12px 0 0;font-size:12.5px;color:#8A97A8}
.emq .note2 .ns a{color:#18263B}

/* close ----------------------------------------------------------------- */
.emq .close{background:#18263B;padding:56px 0}
.emq .close h2{color:#fff;font-size:34px}
.emq .close p{color:rgba(255,255,255,.62);font-size:13px;line-height:1.7;
 margin:18px 0 0;max-width:72ch}
.emq .close .btn{margin-top:26px}

@media(max-width:900px){
 .emq .hgrid{grid-template-columns:1fr;gap:40px}
 .emq h1{font-size:40px} .emq h2{font-size:32px}
 .emq .sec-head{flex-direction:column;align-items:flex-start}
 .emq .sec-head > p{text-align:left}
 .emq a.card{flex-direction:column;align-items:stretch}
 .emq .art,.emq a.card.first .art{flex-basis:auto;width:100%}
 .emq .answer p:first-child{font-size:20px}
 .emq .panel .note{left:12px;bottom:-12px}
}

.emq .search{margin-top:30px;max-width:680px;position:relative}
.emq .search input{width:100%;font:18px 'Open Sans',Arial,sans-serif;padding:18px 130px 18px 22px;
 border-radius:8px;border:2px solid transparent;background:#fff;color:#18263B;outline:0}
.emq .search input:focus{border-color:#F15959}
.emq .search button{position:absolute;right:8px;top:8px;bottom:8px;border:0;border-radius:6px;
 background:#F15959;color:#fff;font:15px 'Franklin Gothic Demi',Arial,sans-serif;padding:0 20px;
 cursor:pointer}
.emq .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.emq .chips button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);
 color:#fff;border-radius:999px;padding:6px 13px;font:13px 'Open Sans',Arial,sans-serif;cursor:pointer}
.emq .chips button:hover{background:rgba(255,255,255,.2)}
.emq .result{padding:44px 0 70px}
.emq .route{display:inline-block;font:12px 'Franklin Gothic Demi',Arial,sans-serif;
 letter-spacing:1.4px;text-transform:uppercase;padding:5px 11px;border-radius:999px;margin-bottom:16px}
.emq .route.page{background:#E6F4EC;color:#1B7F4B}
.emq .route.live{background:#FDE8E8;color:#F15959}
.emq .rq{font:30px/1.15 'Franklin Gothic Heavy','Franklin Gothic Demi',Arial,sans-serif;
 color:#18263B;margin:0 0 22px}
.emq .ans p{font-size:18.5px;line-height:1.75;margin:0 0 20px;max-width:64ch}
.emq .ans p:first-child{font:22px/1.5 'Franklin Gothic Demi',Arial,sans-serif;color:#18263B}
.emq .cursor:after{content:"\258B";color:#F15959;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.emq .related{margin:26px 0 0;padding:16px 20px;background:#F5F6F8;border-radius:10px;
 border-left:4px solid #F15959;max-width:64ch}
.emq .related a{color:#18263B;font-family:'Franklin Gothic Demi',Arial,sans-serif}
.emq .eps2{display:grid;gap:12px;margin-top:30px;max-width:860px}
.emq .eps2 a{display:flex;gap:18px;align-items:center;text-decoration:none;background:#fff;
 border:1px solid #D0D5DD;border-radius:10px;padding:12px}
.emq .eps2 a:hover{border-color:#18263B}
.emq .eps2 img,.emq .eps2 .nt{width:170px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;
 flex:0 0 170px;background:#18263B;color:#fff;display:flex;align-items:center;justify-content:center;
 font:11px 'Franklin Gothic Demi',Arial,sans-serif;text-align:center;padding:8px;text-transform:uppercase}
.emq .eps2 .t{color:#18263B;font:16px/1.3 'Franklin Gothic Demi',Arial,sans-serif;display:block}
.emq .eps2 .m{color:#8A97A8;font-size:13px;display:block;margin-top:5px}
.emq .eps2 .j{display:inline-block;margin-top:8px;background:#18263B;color:#fff;border-radius:5px;
 padding:5px 10px;font:12.5px 'Franklin Gothic Demi',Arial,sans-serif}
.emq .eps2 .j b{color:#F15959;font-weight:400}
.audit-toggle{position:fixed;right:20px;bottom:20px;z-index:20;background:#18263B;color:#fff;
 border:0;border-radius:999px;padding:12px 20px;font:14px 'Franklin Gothic Demi',Arial,sans-serif;
 cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.audit{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:#fff;z-index:19;
 box-shadow:-10px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:.25s;
 overflow:auto;font:14px/1.55 'Segoe UI',system-ui,sans-serif;color:#3A4A5C}
.audit.on{transform:none}
.audit h3{margin:0;padding:18px 22px;background:#18263B;color:#fff;font-size:16px;position:sticky;top:0}
.audit section{padding:16px 22px;border-bottom:1px solid #EEF1F4}
.audit h4{margin:0 0 8px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#18263B}
.audit .kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;font-size:13px}
.audit .kv b{color:#8A97A8;font-weight:600}
.audit .f{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;margin:0 6px 6px 0;font-weight:600}
.audit .f.ok{background:#E6F4EC;color:#1B7F4B}.audit .f.warn{background:#FDF3E2;color:#B7791F}
.audit .f.fail{background:#FDE8E8;color:#F15959}.audit .f.info{background:#ECEFF3;color:#5A6B7D}
.audit details{border:1px solid #E4E8EC;border-radius:6px;margin-bottom:7px;background:#FAFBFC}
.audit summary{cursor:pointer;padding:8px 11px;font:12px ui-monospace,monospace}
.audit pre{margin:0;padding:11px;white-space:pre-wrap;font:12px/1.55 ui-monospace,monospace;
 border-top:1px solid #E4E8EC;max-height:260px;overflow:auto}
.audit .muted{color:#8A97A8}

.tag{background:#F15959;color:#fff;font:600 12px Arial;letter-spacing:1.5px;text-transform:uppercase;
text-align:center;padding:8px}</style></head><body>
<div class="tag">Internal test bed. Not on equitymates.com. Answers here are not reviewed.</div>
<div class="emq"><div class="hero" style="padding-bottom:48px"><div class="wrap">
<p class="kicker">Ask Equity Mates</p>
<h1 style="max-width:18ch">Ten years of answers, in <span class="hl">one search</span>.</h1>
<form id="emq-form" class="search"><input id="emq-q" type="search" autocomplete="off"
 placeholder="Ask anything, the way a reader would"><button type="submit">Ask</button></form>
<div class="chips"><button type="button" data-q="What is debt recycling?">What is debt recycling?</button><button type="button" data-q="tell me about franking credits">tell me about franking credits</button><button type="button" data-q="is negative gearing still allowed in 2027">is negative gearing still allowed in 2027</button><button type="button" data-q="give me an example of debt recycling with numbers">give me an example of debt recycling with numbers</button><button type="button" data-q="should I salary sacrifice into super?">should I salary sacrifice into super?</button><button type="button" data-q="what is a stock split">what is a stock split</button></div></div></div>
<div id="emq-result" class="result"><div class="wrap"><p style="color:#8A97A8">Search above. Open
the audit view (bottom right) to see how each search is handled.</p></div></div></div>
<button id="emq-toggle" class="audit-toggle">Audit view</button>
<aside id="emq-audit" class="audit"><h3>Audit view</h3><div class="body"></div></aside>
<script>
(function(){
var D=null, LAST=null;
// Port of ask_guard._norm / topic_key / route. Kept honest by the parity check below.
var LEAD=[/^(can you |could you |please )?(tell me|teach me|explain|describe|define)( me)?( all)?( about| what| how| the)?\b/,
 /^what (is|are|does|do)( a| an| the)?\b/,/^how (does|do)( a| an| the)?\b/,/^whats\b/,/^what's\b/,
 /^(i want to know|i'd like to know|help me understand)\b/,/^(a |an |the )/];
function norm(t){t=(t||'').normalize('NFKD').toLowerCase().replace(/[’‘]/g,"'");
 return t.replace(/[^\w\s'$]/g,' ').replace(/\s+/g,' ').trim();}
function topicKey(t){var q=norm(t),ch=true;while(ch){ch=false;for(var i=0;i<LEAD.length;i++){
 var n=q.replace(LEAD[i],' ').trim();if(n!==q){q=n;ch=true;}}}
 q=q.replace(/\b(mean|means|work|works|about|exactly|explained|in australia|for beginners)\b/g,' ')
  .replace(/\b(a|an|the|of|to|for|is|are|do|does|my|your)\b/g,' ');
 var w=q.replace(/\s+/g,' ').trim().split(' ').filter(Boolean),u=[];
 w.forEach(function(x){if(u.indexOf(x)<0)u.push(x);});u.sort();return u.join(' ');}
function words(k){return k?k.split(' '):[];}
function route(q){var key=topicKey(q);if(!key)return{a:'live',t:null,key:key,why:'empty after normalising'};
 var kw=words(key);
 for(var i=0;i<D.topics.length;i++){var t=D.topics[i],tw=words(t.key);if(!tw.length)continue;
  if(key===t.key)return{a:'page',t:t,key:key,why:'same subject as a written page'};
  var sub=tw.every(function(w){return kw.indexOf(w)>=0}),extra=kw.filter(function(w){return tw.indexOf(w)<0}).length;
  if(sub&&extra<=1&&tw.length>=2)return{a:'page',t:t,key:key,why:'same subject plus one word'};}
 var best=null,ov=0;
 D.topics.forEach(function(t){var tw=words(t.key),s=kw.filter(function(w){return tw.indexOf(w)>=0}).length;
  if(s>ov&&s>=Math.max(1,tw.length-1)){best=t;ov=s;}});
 return{a:'live',t:best,key:key,why:best?'a different question about a written topic':'no written page covers this'};}
function esc(s){return(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]});}
// Citation markers are stripped from the stream but the space before them is not,
// leaving "the budget changes .". Cleaned on the whole text rather than per chunk,
// because a chunk boundary can fall between the space and the full stop.
function tidy(t){return t.replace(/[ \t]+([.,;:!?)])/g,'$1').replace(/[ \t]{2,}/g,' ');}
function paras(t){return tidy(t).split('\n').filter(function(x){return x.trim()}).map(function(x){return'<p>'+esc(x)+'</p>'}).join('');}
function epCards(eps){return'<div class="eps2">'+(eps||[]).map(function(e){
 var m=e.moment,link=(m&&m.url)||e.url,meta=[e.show,e.year||(e.date||'').slice(0,4),e.mins?e.mins+' min':''].filter(Boolean).join(' · ');
 return'<a href="'+esc(link)+'" target="_blank">'+(e.thumb?'<img src="'+esc(e.thumb)+'" alt="">':'<span class="nt">'+esc(e.show)+'</span>')+
 '<span><span class="t">'+esc(e.title)+'</span><span class="m">'+esc(meta)+'</span>'+
 '<span class="j">▶ '+(m?'Jump to <b>'+esc(m.label)+'</b>':'Listen')+'</span></span></a>';}).join('')+'</div>';}
function noteBox(n,lead){if(!n)return'';var src=(n.sources||[]).map(function(x){return'<a target="_blank" href="'+esc(x.url)+'">'+esc(x.label)+'</a>'}).join(' \u00b7 ');
 return'<div class="note2"><div class="nh"><span class="nt">'+esc(lead||n.title)+'</span><span class="nd">Checked '+esc(n.checked)+'</span></div>'+
 '<p>'+esc(n.text)+'</p><p class="ns">Equity Mates editorial note, not from an episode. Sources: '+src+'</p></div>';}
var R=document.getElementById('emq-result'),A=document.getElementById('emq-audit');
function chip(s,l){return'<span class="f '+s+'">'+esc(l)+'</span>';}
function renderAudit(){if(!LAST){A.querySelector('.body').innerHTML='<section class="muted">Search for something to see how it was handled.</section>';return;}
 var x=LAST,h='<section><h4>Routing</h4><div class="kv"><b>Decision</b><span>'+(x.r.a==='page'?'Pre-written page':'Live answer')+'</span>'+
 '<b>Why</b><span>'+esc(x.r.why)+'</span><b>Your words reduce to</b><span><code>'+esc(x.r.key)+'</code></span>'+
 '<b>Matched topic</b><span>'+esc(x.r.t?x.r.t.question:'none')+'</span></div></section>';
 if(x.r.a==='page'){var t=x.r.t;
  h+='<section><h4>Checks on this page</h4>'+(t.checks.length?t.checks.map(function(c){return chip(c[0],c[1])}).join(''):chip('ok','All checks passed'))+
  '<p class="muted" style="margin:8px 0 0">WordPress draft: <a target="_blank" href="https://equitymates.com/?page_id='+t.page_id+'&preview=true">page '+t.page_id+'</a> (log in to preview)</p></section>'+
  '<section><h4>What the model read ('+t.sources.length+' passages)</h4><p class="muted" style="margin:0 0 8px">Check any claim in the answer against these.</p>'+
  t.sources.map(function(s){return'<details><summary>'+esc(s.filename)+' · '+s.score+'</summary><pre>'+esc(s.text)+'</pre></details>'}).join('')+'</section>';}
 else{h+='<section><h4>Live answer</h4><div class="kv"><b>Personal question</b><span>'+(x.personal?'yes, answered generally':'no')+'</span>'+
  '<b>Advice audit</b><span>'+(x.flagged===null?'running':(x.flagged?'FLAGGED':'passed'))+'</span>'+
  '<b>First words</b><span>'+(x.first?(x.first/1000).toFixed(1)+'s':'waiting')+'</span>'+
  '<b>Complete</b><span>'+(x.total?(x.total/1000).toFixed(1)+'s':'streaming')+'</span>'+
  '<b>Episodes cited</b><span>'+(x.eps?x.eps.length:'-')+'</span></div>'+
  '<p class="muted" style="margin:10px 0 0">Live answers are not pre-reviewed. That is what this view is for.</p></section>';}
 h+='<section><h4>Routing self-check</h4>'+D.parityHtml+'</section>';
 A.querySelector('.body').innerHTML=h;}
function show(q){q=(q||'').trim();if(!q)return;var r=route(q);
 LAST={q:q,r:r,personal:null,flagged:null,first:null,total:null,eps:null};
 var head='<span class="route '+r.a+'">'+(r.a==='page'?'Pre-written page':'Live answer')+'</span><h2 class="rq">'+esc(q)+'</h2>';
 if(r.a==='page'){var t=r.t;R.innerHTML='<div class="wrap">'+head+noteBox(t.note)+'<div class="ans">'+paras(t.prose)+'</div>'+epCards(t.episodes)+'</div>';renderAudit();return;}
 // A live answer near a topic with a current-status note shows that note first: the
 // archive can be older than the law, and the reader should meet today's position.
 R.innerHTML='<div class="wrap">'+head+(r.t&&r.t.note?noteBox(r.t.note,'Where things stand on '+r.t.question.replace(/^What is |\?$/g,'')):'')+'<div class="ans cursor" id="emq-live"></div>'+
  (r.t?'<div class="related">Related guide: <a href="#" data-q="'+esc(r.t.question)+'">'+esc(r.t.question)+'</a></div>':'')+'<div id="emq-eps"></div></div>';
 renderAudit();live(q);}
async function live(q){var S=LAST,box=document.getElementById('emq-live'),t0=performance.now(),text='';
 try{var res=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:q})});
  if(!res.ok){var b=await res.json().catch(function(){return{}});box.classList.remove('cursor');
   box.innerHTML='<p>'+esc(b.error||('Error '+res.status))+'</p>';return;}
  var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
  for(;;){var g=await rd.read();if(g.done)break;buf+=dec.decode(g.value,{stream:true});
   var ls=buf.split('\n');buf=ls.pop()||'';
